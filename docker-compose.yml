name: rossmann-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rossmann-api:local
    init: true
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
